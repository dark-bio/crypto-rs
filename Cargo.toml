[package]
name = "darkbio-crypto"
version = "0.17.0"
authors = ["Péter Szilágyi <peter@dark.bio>"]
description = "Cryptography primitives and wrappers"
repository = "https://github.com/dark-bio/crypto-rs"
documentation = "https://docs.rs/darkbio-crypto"
categories = ["cryptography", "encoding"]
keywords = ["post-quantum", "c-mldsa", "x-wing", "hpke", "cose"]
license = "BSD-3-Clause"
edition = "2024"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = [".", "src/cbor/derive"]

[features]
default = []
argon2 = ["dep:argon2"]
cbor = ["dep:thiserror", "dep:darkbio-crypto-cbor-derive"]
cose = ["cbor", "xdsa", "xhpke"]
cwt = ["cose"]
eddsa = [
    "pem",
    "dep:der",
    "dep:ed25519-dalek",
    "ed25519-dalek/zeroize",
    "dep:pkcs8",
    "dep:serde",
    "dep:sha2",
    "dep:spki",
    "dep:zeroize",
]
hkdf = ["dep:hkdf", "dep:sha2"]
mldsa = [
    "pem",
    "dep:der",
    "dep:ml-dsa",
    "dep:pkcs8",
    "dep:serde",
    "dep:sha2",
    "dep:spki",
    "dep:subtle",
    "dep:zeroize",
]
pem = ["dep:base64", "dep:thiserror"]
rand = []
rsa = ["pem", "dep:rsa", "dep:serde", "dep:zeroize"]
stream = ["dep:chacha20poly1305", "dep:pin-project", "dep:secrecy", "dep:zeroize"]
xdsa = ["pem", "eddsa", "mldsa"]
xhpke = [
    "pem",
    "dep:hpke",
    "dep:pkcs8",
    "dep:rand_chacha",
    "dep:serde",
    "dep:sha2",
    "dep:spki",
    "dep:subtle",
    "dep:zeroize",
]

[dependencies]
argon2 = { version = "0.6.0", optional = true }
base64 = { version = "0.23.1", optional = true }
chacha20poly1305 = { version = "0.11.0", optional = true }
darkbio-crypto-cbor-derive = { version = "0.17.0", path = "src/cbor/derive", optional = true }
der = { version = "0.8.1", features = ["derive"], optional = true }
ed25519-dalek = { version = "3.0.0", features = ["pem", "rand_core"], optional = true }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
hkdf = { version = "0.13.0", optional = true }
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "mlkem", "x25519", "chacha", "hkdfsha2"], optional = true }
ml-dsa = { version = "0.1.1", features = ["rand_core"], optional = true }
pin-project = { version = "1.1.13", optional = true }
pkcs8 = { version = "0.11.0", features = ["std"], optional = true }
rand_chacha = { version = "0.10.0", optional = true }
rsa = { version = "0.9.10", features = ["sha2"], optional = true }
secrecy = { version = "0.10.3", optional = true }
serde = { version = "1.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
spki = { version = "0.8.0", features = ["alloc"], optional = true }
subtle = { version = "2.6.1", optional = true }
thiserror = { version = "2.0", optional = true }
web-time = "1.1.0"
zeroize = { version = "1.8.2", optional = true }

[dev-dependencies]
hex = "0.4"
miniz_oxide = "0.9"
serde_json = "1.0"
