[package]
name = "darkbio-crypto"
version = "0.21.0"
authors = ["Péter Szilágyi <peter@dark.bio>"]
description = "Cryptography primitives and wrappers"
repository = "https://github.com/dark-bio/crypto-rs"
documentation = "https://docs.rs/darkbio-crypto"
categories = ["cryptography", "encoding"]
keywords = ["post-quantum", "c-mldsa", "x-wing", "hpke", "cose"]
license = "BSD-3-Clause"
edition = "2024"
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = [".", "src/cbor/derive"]

[features]
default = []
argon2 = ["dep:argon2", "dep:getrandom", "dep:zeroize"] # enables wasm_js on transitive getrandom
cbor = ["dep:thiserror", "dep:darkbio-crypto-cbor-derive"]
cose = ["cbor", "xdsa", "xhpke", "dep:web-time"]
cwt = ["cose"]
eddsa = [
    "pem",
    "dep:der",
    "dep:ed25519-dalek",
    "dep:getrandom",
    "dep:pkcs8",
    "dep:serde",
    "dep:sha2",
    "dep:spki",
    "dep:zeroize",
]
hkdf = ["dep:hkdf", "dep:sha2", "dep:zeroize"]
mldsa = [
    "pem",
    "dep:der",
    "dep:getrandom",
    "dep:ml-dsa",
    "dep:pkcs8",
    "dep:serde",
    "dep:sha2",
    "dep:spki",
    "dep:subtle",
    "dep:zeroize",
]
pem = ["dep:base64", "dep:thiserror", "dep:zeroize"]
rand = ["dep:getrandom"]
rsa = [
    "pem",
    "dep:der",
    "dep:getrandom",
    "dep:pkcs8",
    "dep:rsa",
    "dep:serde",
    "dep:sha2",
    "dep:spki",
    "dep:zeroize",
]
stream = ["dep:chacha20poly1305", "dep:getrandom", "dep:pin-project", "dep:secrecy", "dep:zeroize"] # enables wasm_js on transitive getrandom
xdsa = ["pem", "eddsa", "mldsa"]
xhpke = [
    "pem",
    "dep:chacha20poly1305", # enables zeroize on the AEAD used by hpke
    "dep:getrandom",
    "dep:hpke",
    "dep:pkcs8",
    "dep:serde",
    "dep:sha2",
    "dep:spki",
    "dep:subtle",
    "dep:zeroize",
]

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"], optional = true }
base64 = { version = "0.23.1", optional = true }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"], optional = true }
darkbio-crypto-cbor-derive = { version = "=0.21.0", path = "src/cbor/derive", optional = true }
der = { version = "0.8.3", features = ["derive"], optional = true }
ed25519-dalek = { version = "3.0.0", features = ["pem", "rand_core", "zeroize"], optional = true }
getrandom = { version = "0.4.3", features = ["sys_rng", "wasm_js"], optional = true } # wasm_js also needs the getrandom_backend cfg set in .cargo/config.toml
hkdf = { version = "0.13.0", optional = true }
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "mlkem", "x25519", "chacha", "hkdfsha2", "getrandom"], optional = true }
ml-dsa = { version = "0.1.2", features = ["rand_core", "zeroize"], optional = true }
pin-project = { version = "1.2.0", optional = true }
pkcs8 = { version = "0.11.0", features = ["std"], optional = true }
rsa = { version = "0.10.0", features = ["pkcs1v15"], optional = true }
secrecy = { version = "0.10.3", optional = true }
serde = { version = "1.0", optional = true }
sha2 = { version = "0.11.1", features = ["zeroize"], optional = true }
spki = { version = "0.8.1", features = ["alloc"], optional = true }
subtle = { version = "2.6.1", optional = true }
thiserror = { version = "2.0.21", optional = true }
web-time = { version = "1.1.0", optional = true }
zeroize = { version = "1.9.2", optional = true }

[dev-dependencies]
hex = "0.4"
miniz_oxide = "0.9"
serde_json = "1.0"
